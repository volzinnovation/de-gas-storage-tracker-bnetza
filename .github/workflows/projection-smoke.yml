name: Projection Smoke Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "index.html"
      - "styles.css"
      - "dashboard.js"
      - "data/projections.csv"
      - "data/eu_storage.csv"
      - "data/gie_storage.csv"
      - "requirements.txt"
      - ".github/workflows/daily-gasspeicher-projection.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/projection-smoke.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile projection script
        run: |
          python -m py_compile \
            scripts/2026_gasspeicher_deutschland.py \
            scripts/projection_status.py \
            scripts/validate_dashboard.py \
            scripts/update_gie_storage.py

      - name: Check dashboard JavaScript syntax
        run: node --check dashboard.js

      - name: Test GIE API failure recovery
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Print projection status
        run: python scripts/projection_status.py --format json

      - name: Validate static dashboard
        run: python scripts/validate_dashboard.py
